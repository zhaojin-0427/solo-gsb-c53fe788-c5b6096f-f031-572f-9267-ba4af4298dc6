services:
  umi-consensus:
    build: .
    image: umi-consensus:latest
    container_name: umi-consensus
    ports:
      - "8000:8000"
    environment:
      UMI_DB_PATH: /data/umi.db
    volumes:
      - umi-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)).get('status')=='ok' else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

volumes:
  umi-data:
